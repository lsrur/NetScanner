name: NetScanner
options:
  bundleIdPrefix: com.lautarosrur
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  NetScanner:
    type: application
    platform: macOS
    sources:
      - path: NetScanner
    info:
      path: NetScanner/Info.plist
      properties:
        CFBundleDisplayName: NetScanner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSBonjourServices:
          - _adisk._tcp
          - _afpovertcp._tcp
          - _airplay._tcp
          - _airport._tcp
          - _amzn-wplay._tcp
          - _androidtvremote2._tcp
          - _companion-link._tcp
          - _daap._tcp
          - _device-info._tcp
          - _esphomelib._tcp
          - _googlecast._tcp
          - _hap._tcp
          - _home-assistant._tcp
          - _homekit._tcp
          - _http._tcp
          - _https._tcp
          - _hue._tcp
          - _ipp._tcp
          - _ipps._tcp
          - _matter._tcp
          - _meshcop._udp
          - _mqtt._tcp
          - _pdl-datastream._tcp
          - _printer._tcp
          - _raop._tcp
          - _rfb._tcp
          - _scanner._tcp
          - _services._dns-sd._udp
          - _sftp-ssh._tcp
          - _shelly._tcp
          - _smb._tcp
          - _sonos._tcp
          - _spotify-connect._tcp
          - _ssh._tcp
          - _uscan._tcp
          - _workstation._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: NetScanner needs local network access to discover devices, ping them and scan their ports.
        NSLocationUsageDescription: The Wi-Fi Analyzer needs Location access because macOS only reveals the names and BSSIDs of nearby Wi-Fi networks to apps that have it. NetScanner doesn't use your location.
        NSLocationWhenInUseUsageDescription: The Wi-Fi Analyzer needs Location access because macOS only reveals the names and BSSIDs of nearby Wi-Fi networks to apps that have it. NetScanner doesn't use your location.
    entitlements:
      path: NetScanner/NetScanner.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lautarosrur.NetScanner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  NetScannerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NetScannerTests
    dependencies:
      - target: NetScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
