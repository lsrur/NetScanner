name: NetScanner
options:
  bundleIdPrefix: com.lautarosrur
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  NetScanner:
    type: application
    platform: macOS
    sources:
      - path: NetScanner
    info:
      path: NetScanner/Info.plist
      properties:
        CFBundleDisplayName: NetScanner
        LSApplicationCategoryType: public.app-category.developer-tools
        NSLocalNetworkUsageDescription: NetScanner needs local network access to discover devices, ping them and scan their ports.
    entitlements:
      path: NetScanner/NetScanner.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lautarosrur.NetScanner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  NetScannerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NetScannerTests
    dependencies:
      - target: NetScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
